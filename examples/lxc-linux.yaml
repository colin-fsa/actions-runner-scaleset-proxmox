# Linux runners as unprivileged LXC containers, Windows runners as QEMU VMs.
# Replace names, endpoint, node and template VMIDs for your installation.
# Supply SCALESET_GITHUB_PAT_TOKEN and SCALESET_PROXMOX_AUTH_TOKEN_SECRET
# through your environment or secret manager. Requires Proxmox VE 9.x (the
# container `env` option). See docs/lxc-runners.md.
github:
  auth_mode: pat
  pat: {}

scalesets:
  - name: linux-x64
    scope: { org: my-org }
    labels: [self-hosted, linux, x64, proxmox-linux]
    runner_group: default
    max_concurrent_runners: 8
    vmid_range: { min: 10000, max: 10999 }
    profiles:
      - name: linux
        guest_type: lxc          # unprivileged container; JIT delivered via the container env
        labels: [self-hosted, linux, x64, proxmox-linux]
        template_vmid: 9200      # an LXC container template (required for lxc)
        cpu: 4
        memory_mb: 8192          # hard cgroup limit; swap is forced to 0
        disk_gb: 40              # rootfs resize; omit to keep the template's size
        hot_size: 1              # containers start in seconds, so small pools suffice
        warm_size: 0
        max_concurrent_runners: 8
  - name: windows-x64
    scope: { org: my-org }
    labels: [self-hosted, windows, x64, proxmox-windows]
    runner_group: default
    max_concurrent_runners: 2
    vmid_range: { min: 11000, max: 11999 }
    profiles:
      - name: windows
        guest_os: windows
        labels: [self-hosted, windows, x64, proxmox-windows]
        template_vmid: 9100
        cpu: 4
        memory_mb: 8192
        hot_size: 0
        warm_size: 0
        max_concurrent_runners: 2

proxmox:
  endpoint: https://pve.example.com:8006/api2/json
  auth:
    token_id: scaleset@pve!automation
  template_vmid: 9100
  vmid_range: { min: 10000, max: 11999 }
  storage: { disk: local-lvm, snippets: local }
  network: { bridge: vmbr0 }
  clone: { linked: true }

nodes:
  strategy: single
  single_node: pve

pool:
  hot_size: 0
  warm_size: 0
  # Applies to the Windows (QEMU) scale set. The all-LXC scale set always
  # recycles by destroy.
  recycle_mode: snapshot_rollback
  capacity:
    enabled: true
    reserve_memory_mb: 4096
    cpu_overcommit_ratio: 2.0
